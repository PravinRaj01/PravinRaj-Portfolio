[project]
name = "gg-portfolio-backend"
version = "0.1.0"
description = "FastAPI backend replacing Supabase for the gg-portfolio app (see /MIGRATION_PLAN.md)"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30",
    "alembic>=1.14",
    "pydantic[email]>=2.9",
    "pydantic-settings>=2.6",
    "pyjwt>=2.9",
    "pwdlib[argon2]>=0.2",
    "aioboto3>=13.2",
    "python-multipart>=0.0.12",
    "httpx>=0.27",
    "pgvector>=0.3.6",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
]

[tool.setuptools.packages.find]
include = ["app*"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
